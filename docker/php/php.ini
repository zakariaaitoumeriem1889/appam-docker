[PHP]
engine             = On
short_open_tag     = Off
precision          = 14
output_buffering   = 4096
zlib.output_compression = Off
implicit_flush     = Off
unserialize_callback_func =
serialize_precision = 17
disable_functions  = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,\
pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wexitstatus,\
pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,\
pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,\
pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority
disable_classes    =
expose_php         = Off
zend.enable_gc     = On

; ── Limites ─────────────────────────────────────────────────────
max_execution_time  = 300
max_input_time      = 60
memory_limit        = 512M
post_max_size       = 64M
upload_max_filesize = 32M
max_file_uploads    = 20

; ── Erreurs (développement) ─────────────────────────────────────
error_reporting        = E_ALL
display_errors         = On
display_startup_errors = On
log_errors             = On
log_errors_max_len     = 4096
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks        = On
html_errors            = On
error_log              = /var/log/apache2/php-error.log

; ── Variables ───────────────────────────────────────────────────
variables_order  = "GPCS"
request_order    = "GP"
register_argc_argv = Off
auto_globals_jit = On

; ── Fichiers ────────────────────────────────────────────────────
file_uploads         = On
allow_url_fopen      = On
allow_url_include    = Off
default_socket_timeout = 60

; ── Charset ─────────────────────────────────────────────────────
default_mimetype = "text/html"
default_charset  = "UTF-8"

; ── Date ────────────────────────────────────────────────────────
[Date]
date.timezone = Europe/Paris

; ── Session ─────────────────────────────────────────────────────
[Session]
session.save_handler    = files
session.use_strict_mode = 0
session.use_cookies     = 1
session.use_only_cookies = 1
session.name            = PHPSESSID
session.auto_start      = 0
session.cookie_lifetime = 0
session.cookie_path     = /
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.serialize_handler = php
session.gc_probability  = 1
session.gc_divisor      = 1000
session.gc_maxlifetime  = 1440
session.cache_limiter   = nocache
session.cache_expire    = 180
session.use_trans_sid   = 0

; ── PDO / MySQL ─────────────────────────────────────────────────
[Pdo_mysql]
pdo_mysql.cache_size    = 2000
pdo_mysql.default_socket =

; ── OPcache ─────────────────────────────────────────────────────
[opcache]
opcache.enable                = 1
opcache.memory_consumption    = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq       = 0
opcache.validate_timestamps   = 1
opcache.fast_shutdown         = 1

; ── Xdebug ──────────────────────────────────────────────────────
;  Passer XDEBUG_MODE=off dans l'environnement pour désactiver
[xdebug]
xdebug.mode             = debug
xdebug.start_with_request = trigger
xdebug.client_host      = host.docker.internal
xdebug.client_port      = 9003
xdebug.idekey           = PHPSTORM
xdebug.log              = /var/log/xdebug.log

; ── APCu ────────────────────────────────────────────────────────
[apcu]
apc.enabled  = 1
apc.shm_size = 64M

; ── CLI Server ──────────────────────────────────────────────────
[CLI Server]
cli_server.color = On

; ── Misc ────────────────────────────────────────────────────────
[mail function]
SMTP      = mailer
smtp_port = 1025
mail.add_x_header = On

[soap]
soap.wsdl_cache_enabled = 1
soap.wsdl_cache_dir     = "/tmp"
soap.wsdl_cache_ttl     = 86400
soap.wsdl_cache_limit   = 5

[ldap]
ldap.max_links = -1
